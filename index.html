<style>
:root{
  /* 鍚庡彴浜満 */
  --canvas:#F0ECF8;
  --world:#D9D0EE;
  --world-2:#C4B7E3;
  --accent:#7C6BB5;
  --accent-deep:#5E4E91;
  --ink:#3B3354;
  --ink-2:#6B6388;
  --ink-3:#9A92B5;
  --white:#FFFFFF;
  /* 鍓嶅彴鏆楀満 */
  --stage-bg:#1E1830;
  --stage-bg2:#2D2445;
  --stage-text:#E8E1F8;
  --stage-accent:#B89FF0;
  --stage-dim:rgba(232,225,248,.5);

  --ease:cubic-bezier(.22,.75,.3,1);
  --bar:76px;
  --r-shell:28px;
  --r-card:16px;
  --r-control:10px;
  --r-pill:999px;
  --shadow-card:0 2px 6px rgba(124,107,181,.08),0 16px 36px -10px rgba(124,107,181,.16),0 48px 90px -40px rgba(124,107,181,.22);
  --shadow-soft:0 1px 2px rgba(59,51,84,.04),0 8px 20px -6px rgba(59,51,84,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--canvas);color:var(--ink);overflow:hidden;
  font-family:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img,svg{display:block}
input,textarea{font:inherit;outline:none;border:0}

/* 鈺愨晲鈺?瑙嗗浘鍒囨崲 鈺愨晲鈺?*/
.view{display:none;width:100%;height:100%}
.view.active{display:flex;flex-direction:column}

/* 鈺愨晲鈺?鍏ュ彛閫夋嫨 鈺愨晲鈺?*/
#view-home{align-items:center;justify-content:center;gap:40px;padding:40px;
  background:radial-gradient(130% 90% at 50% 8%,#E8E1F5,#D4C9EB 72%)}
.home-title{font-family:"Noto Serif SC",serif;font-size:36px;font-weight:900;color:var(--ink);text-align:center}
.home-sub{font-size:14px;color:var(--ink-2);text-align:center;margin-top:8px}
.home-btns{display:flex;flex-direction:column;gap:16px;width:100%;max-width:280px;margin-top:20px}
.home-btn{padding:20px;border-radius:var(--r-shell);background:var(--white);
  box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:6px;align-items:flex-start;
  transition:transform .2s var(--ease);text-align:left}
.home-btn:active{transform:scale(.98)}
.home-btn .hb-icon{width:40px;height:40px;border-radius:12px;background:var(--canvas);
  display:grid;place-items:center;color:var(--accent);margin-bottom:4px}
.home-btn .hb-title{font-size:18px;font-weight:700;color:var(--ink)}
.home-btn .hb-desc{font-size:13px;color:var(--ink-2)}
.home-btn.stage .hb-icon{background:#2D2445;color:var(--stage-accent)}

/* 鈺愨晲鈺?鍚庡彴瑙嗗浘 鈺愨晲鈺?*/
#view-admin{background:var(--canvas)}
.stage-bg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(130% 90% at 50% 8%,#E8E1F5,#D4C9EB 72%)}
.stage-bg::before{content:"";position:absolute;inset:-18%;z-index:0;pointer-events:none;opacity:.3;filter:blur(90px);
  background:radial-gradient(38% 30% at 22% 24%,#B8A6E0,transparent 70%),radial-gradient(42% 34% at 78% 74%,#D4B8E8,transparent 70%)}
#view-admin .inner{position:relative;z-index:1;width:100%;height:100%;overflow:hidden}

.statusbar{position:absolute;top:0;left:0;right:0;z-index:55;height:44px;padding:0 24px;
  display:flex;align-items:center;justify-content:space-between;pointer-events:none;
  font-size:13px;font-weight:600;color:var(--ink)}
.sb-r{display:flex;align-items:center;gap:5px}
.sb-r i{display:block;background:var(--ink);border-radius:1px}
.sb-r .sig{width:15px;height:10px;clip-path:polygon(0 72%,18% 72%,18% 100%,0 100%,0 72%,27% 46%,45% 46%,45% 100%,27% 100%,27% 46%,54% 22%,72% 22%,72% 100%,54% 100%,54% 22%,82% 0,100% 0,100% 100%,82% 100%)}
.sb-r .wifi{width:14px;height:10px;clip-path:polygon(50% 100%,32% 74%,68% 74%,50% 100%,50% 66%,20% 40%,28% 30%,72% 30%,80% 40%,50% 66%,50% 24%,8% 12%,14% 2%,86% 2%,92% 12%)}
.sb-r .bat{width:22px;height:11px;border-radius:3px;background:none;position:relative;box-shadow:inset 0 0 0 1px var(--ink)}
.sb-r .bat::before{content:"";position:absolute;inset:2px;width:64%;background:var(--ink);border-radius:1px}
.sb-r .bat::after{content:"";position:absolute;right:-3px;top:3.5px;width:2px;height:4px;background:var(--ink);border-radius:0 1px 1px 0}

.top{position:absolute;top:0;left:0;right:0;z-index:50;pointer-events:none;
  padding:calc(env(safe-area-inset-top) + 52px) 20px 0;
  display:flex;align-items:center;justify-content:space-between}
.pager{font-size:12px;letter-spacing:.1em;color:var(--ink-3)}
.pager b{color:var(--ink);font-size:15px;font-weight:700}
.back-btn{font-size:13px;color:var(--accent);pointer-events:auto;display:flex;align-items:center;gap:4px}
.bars{position:absolute;top:calc(env(safe-area-inset-top) + 78px);left:20px;right:20px;z-index:50;display:flex;gap:3px;pointer-events:none}
.bars i{flex:1;height:2px;border-radius:2px;background:rgba(124,107,181,.18)}
.bars i.on{background:var(--accent)}

#deck{height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#deck::-webkit-scrollbar{display:none}
.screen{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 100px) 26px calc(var(--bar) + 26px);isolation:isolate}
.content{position:relative;z-index:1;display:flex;flex-direction:column;gap:18px;width:100%}
.an{opacity:0;transform:translateY(22px);transition:opacity .75s var(--ease),transform .75s var(--ease)}
.live .an{opacity:1;transform:none}
.live .an:nth-child(2){transition-delay:.1s}
.live .an:nth-child(3){transition-delay:.2s}
.live .an:nth-child(4){transition-delay:.3s}
.kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:500}
h1{font-family:"Noto Serif SC",serif;font-size:32px;font-weight:900;line-height:1.2;color:var(--ink)}
h2{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;line-height:1.25;color:var(--ink)}
.sub{font-size:14px;line-height:1.7;color:var(--ink-2)}

.dock{position:absolute;left:0;right:0;bottom:0;z-index:50;display:flex;gap:10px;align-items:center;
  padding:12px 20px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(180deg,transparent,rgba(240,236,248,.92) 42%)}
.dock .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  border:1px solid rgba(124,107,181,.28);color:var(--accent)}
.dock .next{flex:1;height:46px;border-radius:var(--r-pill);background:var(--accent);
  color:var(--white);font-weight:700;display:flex;align-items:center;justify-content:center;
  transition:transform .15s var(--ease),opacity .15s}
.dock .next:active{transform:scale(.97)}
.dock .next:disabled{opacity:.4}

.toast{position:absolute;left:50%;bottom:calc(var(--bar) + 26px);z-index:70;
  transform:translate(-50%,14px);opacity:0;pointer-events:none;max-width:78%;
  padding:11px 18px;border-radius:var(--r-pill);background:var(--ink);color:var(--white);
  font-size:13.5px;line-height:1.5;transition:opacity .28s var(--ease),transform .28s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.cover-box{position:relative;width:100%;aspect-ratio:3/4;border-radius:var(--r-shell);overflow:hidden;
  background:linear-gradient(160deg,var(--world) 0%,var(--world-2) 100%);
  box-shadow:var(--shadow-card);cursor:pointer;transition:transform .3s var(--ease)}
.cover-box:active{transform:scale(.98)}
.cover-box img{width:100%;height:100%;object-fit:cover}
.cover-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--accent-deep)}
.cover-ph svg{width:48px;height:48px;opacity:.7}
.cover-ph span{font-size:13px;letter-spacing:.08em}
.cover-tag{position:absolute;bottom:14px;left:14px;padding:6px 12px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.85);backdrop-filter:blur(8px);font-size:11px;font-weight:500;color:var(--accent-deep);letter-spacing:.05em}

.card{background:var(--white);border-radius:var(--r-card);padding:20px;box-shadow:var(--shadow-soft)}
.card-label{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.card-label .count{color:var(--accent);font-weight:700}
textarea{width:100%;min-height:120px;background:var(--canvas);border-radius:var(--r-control);
  padding:14px;font-size:14px;line-height:1.8;color:var(--ink);resize:none;border:1.5px solid transparent;transition:border-color .2s}
textarea:focus{border-color:var(--accent)}
textarea::placeholder{color:var(--ink-3)}
.num-input-row{display:flex;align-items:center;gap:12px;background:var(--canvas);border-radius:var(--r-control);padding:4px 4px 4px 16px}
.num-input-row input{flex:1;background:none;font-size:24px;font-weight:700;color:var(--ink);width:100%;min-width:0}
.stepper{display:flex;flex-direction:column;gap:2px}
.stepper button{width:36px;height:32px;border-radius:8px;background:var(--world);color:var(--accent-deep);font-size:16px;font-weight:700;display:grid;place-items:center}
.stepper button:active{background:var(--world-2)}

/* 鈺愨晲鈺?鍓嶅彴灞曠ず瑙嗗浘 鈺愨晲鈺?*/

  align-items:center;justify-content:flex-end;position:relative;overflow:hidden;

#view-stage::after{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,243,214,.15) 0%,rgba(255,243,214,.1) 40%,rgba(255,243,214,.65) 100%)}
.stage-inner{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;gap:20px;
  padding:0 20px calc(env(safe-area-inset-bottom) + 8vh);width:100%;pointer-events:auto}
.stage-cover{display:none}
.stage-title{display:none}
.result-card{background:rgba(255,251,235,.85);backdrop-filter:blur(12px);border-radius:20px;
  padding:24px 20px;box-shadow:0 16px 48px -12px rgba(92,58,30,.18);
  display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;text-align:center;
  width:100%;max-width:420px;margin-left:auto;margin-right:auto}
.stage-winner{font-family:"Noto Serif SC",serif;font-size:clamp(36px,11vw,64px);font-weight:900;text-align:center;
  color:#5C3A1E;line-height:1.1;min-height:1.2em;word-break:break-all}
.stage-winners{display:flex;flex-wrap:wrap;gap:16px 24px;justify-content:center;max-width:100%}
.stage-winner-item{font-family:"Noto Serif SC",serif;font-size:clamp(22px,6vw,40px);font-weight:900;text-align:center;
  color:#5C3A1E;word-break:break-all}
.stage-hint{font-size:13px;color:#8B6B4A;letter-spacing:.15em}
.history-card{width:90%;max-width:340px;max-height:180px;overflow-y:auto;
  background:rgba(255,251,235,.75);backdrop-filter:blur(10px);
  border-radius:16px;padding:14px 16px;z-index:2;
  border:1px solid rgba(255,255,255,.6)}
.history-title{font-size:12px;font-weight:700;color:#8B6B4A;margin-bottom:8px;letter-spacing:.1em}
.history-list{display:flex;flex-wrap:wrap;gap:8px}
.history-item{font-size:14px;color:#5C3A1E;background:rgba(196,183,227,.3);
  padding:4px 10px;border-radius:999px}
.stage-ring{width:180px;height:180px;border-radius:50%;display:grid;place-items:center;position:relative;margin-bottom:12px}
.stage-ring::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,#F59E0B,transparent 30%,transparent 70%,#D97706);
  animation:spin 1.6s linear infinite}
.stage-ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:rgba(255,251,235,.95)}
.stage-ring .stage-name{position:relative;z-index:1;font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;
  color:#5C3A1E;text-align:center;padding:0 16px;max-width:150px}
@keyframes spin{to{transform:rotate(360deg)}}
.stage-enter{position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:16px;z-index:20;
  padding:8px 14px;border-radius:var(--r-pill);
  background:rgba(255,255,255,.7);color:#5C3A1E;font-size:12px;backdrop-filter:blur(10px);
  border:1px solid rgba(92,58,30,.15)}

/* 瀵嗙爜寮圭獥 */
.pwd-modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.5);display:none;
  align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px)}
.pwd-modal.on{display:flex}
.pwd-box{background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:320px;
  box-shadow:0 24px 60px -12px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:16px}
.pwd-title{font-size:18px;font-weight:700;text-align:center;color:var(--ink)}
.pwd-input{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid #E4E0F0;
  font-size:15px;outline:none}
.pwd-input:focus{border-color:var(--accent)}
.pwd-err{font-size:12px;color:#E53E3E;text-align:center;display:none}
.pwd-err.on{display:block}
.pwd-btns{display:flex;gap:10px;margin-top:4px}
.pwd-cancel{flex:1;height:44px;border-radius:999px;background:#F3F0FA;color:var(--ink-2);font-weight:500}
.pwd-ok{flex:1;height:44px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700}

/* 闅愯棌骞冲彴姘村嵃 */
[class*="watermark"],[class*="Watermark"],[class*="ai-generated"],[class*="badge"],
[class*="float"],[class*="Float"],[class*="fab"],[class*="FAB"],
[class*="bottom-right"],[class*="BottomRight"],[class*="mira"],[class*="Mira"],
[class*="byte"],[class*="Byte"],[id*="watermark"],[id*="badge"],
div[style*="position: fixed"][style*="right: 0px"][style*="bottom: 0px"]{
  display:none !important;
}

/* 澶у睆锛堟闈㈡姇灞忥級閫傞厤 */
@media(min-width:760px){
  #view-stage{background-position:center center;background-size:cover}
  .stage-inner{padding:0 40px 10vh;justify-content:center;height:100%}
  .result-card{padding:40px 60px;max-width:680px}
  .stage-ring{width:260px;height:260px}
  .stage-ring .stage-name{font-size:40px;max-width:220px}
  #posterTitle{margin-top:calc(env(safe-area-inset-top) + 20px)!important}
}

@media(min-width:760px){
  /* 妗岄潰绔悗鍙帮細鍏ㄥ睆瀹藉睆锛屽幓鎺夋墜鏈哄３ */
  #view-admin{display:block}
  #view-admin .inner{width:min(900px,92vw);height:92vh;border-radius:24px;
    box-shadow:0 20px 60px rgba(94,78,145,.2);margin:4vh auto;overflow:hidden}
  #view-admin .screen{padding:40px 60px}
  .an.kicker{font-size:14px}
  .an h2{font-size:32px}
  .cfg-row{padding:16px 20px}
}
/* 鈺愨晲鈺?鎵嬫満绔€傞厤 鈺愨晲鈺?*/
@media(max-width:759px){
  #view-home{padding:60px 24px 40px}
  .home-title{font-size:32px}
  .home-btns{max-width:100%}
  .home-btn{padding:18px}

  .screen{padding:calc(env(safe-area-inset-top) + 80px) 20px calc(var(--bar) + 20px)}
  .top{padding:calc(env(safe-area-inset-top) + 40px) 16px 0}

const ADMIN_PWD='perfectALL7#';
function openPwdModal(){
  document.getElementById('pwdModal').classList.add('on');

  document.getElementById('pwdModal').classList.remove('on');

  const v=document.getElementById('pwdInput').value;

const deck=document.getElementById('deck');

  .scrollIntoView({behavior:'smooth',block:'start'});

const toastEl=document.getElementById('toast');let toastT;

  toastEl.textContent=msg;toastEl.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('on'),1600);
}

const btnNext=document.getElementById('btnNext');
const nextLabels=['寮€濮嬭缃?鈫?,'纭鍚嶅崟 鈫?,'杩涘叆鍓嶅彴 鈫?,'鍓嶅線澶у睆灞曠ず 馃帀'];
function setCur(i){
  cur=i;
  document.getElementById('pgNow').textContent=String(i+1).padStart(2,'0');
  barEls.forEach((b,k)=>b.classList.toggle('on',k<=i));
  btnNext.textContent=nextLabels[i]||'缁х画 鈫?;
  if(i===3){
    const list=getNames();
    document.getElementById('poolCount').textContent=list.length+' 浜?路 '+list.reduce((s,x)=>s+x.weight,0)+' 绛?;
    document.getElementById('poolDraw').textContent=document.getElementById('drawCount').value;
  }
}

const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.intersectionRatio>0.55){e.target.classList.add('live');setCur(screens.indexOf(e.target));}
}),{root:deck,threshold:[0.55]});
screens.forEach(s=>io.observe(s));

btnNext.onclick=()=>{
  if(cur===1){
    if(getNames().length===0){toast('璇峰厛绮樿创鑷冲皯涓€涓悕瀛?);return;}
  }
  if(cur===3){goStage();return;}
  go(cur+1);
};
document.getElementById('btnPrev').onclick=()=>go(cur-1);

/* 鍚嶅崟锛歴tate.names 涓烘暟鎹簮锛宼extarea 鏄壒閲忓鍏ュ叆鍙?*/
const nameInput=document.getElementById('nameInput');
const nameCount=document.getElementById('nameCount');
const ticketCount=document.getElementById('ticketCount');
const nameListEl=document.getElementById('nameList');
let state={names:[]};

function parseNamesFromText(text){
  return text.split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
    const parts=line.split(/[:锛歖/);
    const name=parts[0].trim();
    const weight=Math.max(1,parseInt(parts[1])||1);
    return {name,weight};
  }).filter(x=>x.name);
}
function getNames(){return state.names;}
function updateNameCount(){
  nameCount.textContent=state.names.length;
  ticketCount.textContent=state.names.reduce((s,x)=>s+x.weight,0);
}
function renderNameList(){
  updateNameCount();
  if(state.names.length===0){
    nameListEl.innerHTML='<div style="padding:12px;text-align:center;color:var(--ink-3);font-size:13px">鏆傛棤鍚嶅崟锛岃鍏堢矘璐村鍏?/div>';
    return;
  }
  nameListEl.innerHTML=state.names.map((n,i)=>`
    <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--canvas);border-radius:8px">
      <div style="flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${n.name}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <button onclick="adjustWeight(${i},-1)" style="width:24px;height:24px;border-radius:6px;background:var(--world);color:var(--accent-deep);font-size:14px;font-weight:700">鈭?/button>
        <span style="font-size:13px;font-weight:700;color:var(--accent);min-width:20px;text-align:center">${n.weight}</span>
        <button onclick="adjustWeight(${i},1)" style="width:24px;height:24px;border-radius:6px;background:var(--world);color:var(--accent-deep);font-size:14px;font-weight:700">+</button>
      </div>
    </div>
  `).join('');
}
function adjustWeight(i,delta){
  state.names[i].weight=Math.max(1,state.names[i].weight+delta);
  renderNameList();
  saveData();
}
nameInput.oninput=()=>{
  state.names=parseNamesFromText(nameInput.value);
  renderNameList();
};

document.querySelectorAll('.stepper button').forEach(btn=>{
  btn.onclick=e=>{
    e.stopPropagation();

  };
});

function renderHistory(){
  let history=JSON.parse(localStorage.getItem('lottery-history')||'[]');
  /* 鍏煎鏃ф暟鎹?*/
  if(history.length>0 && (typeof history[0]==='string' || history[0].name)){
    const oldNames=history.map(i=>typeof i==='string'?i:i.name);
    history=[{time:history[0].time||'鍘嗗彶璁板綍',names:oldNames}];
    localStorage.setItem('lottery-history',JSON.stringify(history));
  }
  /* 鍓嶅彴涓嶆樉绀哄巻鍙诧紝鍙洿鏂板悗鍙拌褰?*/
  const adminList=document.getElementById('adminHistoryList');
  const adminCount=document.getElementById('adminHistoryCount');
  if(adminList && adminCount){
    const total=history.reduce((sum,g)=>sum+g.names.length,0);
    adminCount.textContent=`${total} 浜?路 ${history.length} 娆;
    if(history.length>0){
      /* 鍊掑簭灞曠ず锛屾渶鏂扮殑鍦ㄦ渶涓婇潰 */
      adminList.innerHTML=history.slice().reverse().map((group,revIdx)=>{
        const idx=history.length-1-revIdx;
        return `<div style="border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div style="font-size:12px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px">
              <span style="width:6px;height:6px;border-radius:50%;background:var(--accent)"></span>
              ${group.time} 路 ${group.names.length}浜?            </div>
            <button onclick="deleteHistoryGroup(${idx})" style="border:none;background:transparent;color:#DC2626;font-size:11px;cursor:pointer;padding:2px 6px">鍒犻櫎</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${group.names.map(n=>`<span style="padding:3px 8px;border-radius:6px;background:#F3F0FA;font-size:11px;color:var(--ink-2)">${n}</span>`).join('')}
          </div>
        </div>`;
      }).join('');
    }else{
      adminList.innerHTML='<div style="color:var(--ink-3);font-size:12px;width:100%;text-align:center;padding:10px 0">鏆傛棤涓璁板綍</div>';

  let history=JSON.parse(localStorage.getItem('lottery-history')||'[]');

/* 瀵煎嚭CSV */
document.addEventListener('DOMContentLoaded',()=>{
  const exportBtn=document.getElementById('exportHistoryBtn');
  const clearBtn=document.getElementById('clearHistoryBtn');
  const periodInput=document.getElementById('periodInput');
  if(periodInput){
    periodInput.value=localStorage.getItem('lottery-period')||'88';
    periodInput.addEventListener('change',()=>{
      localStorage.setItem('lottery-period',periodInput.value);
      updatePosterTitle();
    });
  }
  if(exportBtn){
    exportBtn.addEventListener('click',()=>{
      const history=JSON.parse(localStorage.getItem('lottery-history')||'[]');
      if(history.length===0){toast('鏆傛棤璁板綍鍙鍑?);return;}
      let csv='\uFEFF鎶界鏃堕棿,涓濮撳悕\n';
      history.forEach(g=>{
        g.names.forEach(n=>{
          csv+=`${g.time},${n}\n`;
        });
      });
      const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=`閲戠鐩茬洅涓璁板綍_${new Date().getTime()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      toast('CSV宸插鍑?);
    });
  }
  if(clearBtn){
    clearBtn.addEventListener('click',()=>{
      if(confirm('纭畾娓呯┖鎵€鏈変腑绛捐褰曞悧锛熸鎿嶄綔涓嶅彲鎭㈠')){
        localStorage.removeItem('lottery-history');
        renderHistory();
        toast('宸叉竻绌哄叏閮ㄨ褰?);
      }
    });
  }
});

    stageHint.textContent='鐐瑰嚮鎸夐挳寮€濮嬫娊绛?;
  }else{
    drawPassUnlocked=false;
    stageHint.textContent='璇疯緭鍏ユ娊绛惧彛浠ゅ紑濮?;
  }
  if(drawnPool.length===0){
    stageWinner.textContent='鏈鍏ュ悕鍗?;
    stageHint.textContent='璇峰厛鍦ㄥ悗鍙拌缃腑瀵煎叆鍚嶅崟';
  }
  /* 宸叉娊杩囧垯閿佸畾 */
  if(localStorage.getItem('lottery-draw-used')==='1'){
    stageWinner.textContent='鎮ㄥ凡鍙備笌杩?;
    stageHint.textContent='姣忎汉浠呬竴娆℃満浼?;
    document.getElementById('resultCard').style.pointerEvents='none';
    document.getElementById('resultCard').style.opacity='0.7';
  }
}

/* 鍓嶅彴鍙ｄ护楠岃瘉 */
function checkDrawPwd(){
  const pass=document.getElementById('drawPasscode').value.trim();
  const v=document.getElementById('drawPwdInput').value;
  if(v===pass){
    document.getElementById('drawPwdModal').classList.remove('on');
    drawPassUnlocked=true;
    stageHint.textContent='鍙ｄ护姝ｇ‘锛岀偣鍑绘寜閽紑濮嬫娊绛?;
  }else{
    document.getElementById('drawPwdErr').classList.add('on');
  }
}
document.getElementById('drawPwdInput').addEventListener('keydown',e=>{
  if(e.key==='Enter')checkDrawPwd();
});

/* 鍔犳潈闅忔満锛氭寜绛炬暟鏉冮噸鎶戒竴涓?*/
function weightedPick(pool){
  const total=pool.reduce((s,x)=>s+x.weight,0);
  let r=Math.random()*total;
  for(let i=0;i<pool.length;i++){
    r-=pool[i].weight;
    if(r<=0)return i;
  }
  return pool.length-1;
}

document.getElementById('view-stage').addEventListener('click',(e)=>{
  /* 鐐瑰悗鍙版寜閽笉瑙﹀彂 */
  if(e.target.closest('.stage-enter'))return;
  /* 鐐逛繚瀛樻寜閽笉瑙﹀彂 */
  if(e.target.closest('#saveImgBtn'))return;
  /* 鍙湁鐐圭粨鏋滃崱鐗囨墠鎶界 */
  if(!e.target.closest('#resultCard'))return;
  if(drawnPool.length===0){
    toast('璇峰厛鍦ㄥ悗鍙板鍏ュ悕鍗?);
    return;
  }
  if(drawTimer)return;
  /* 鍙ｄ护鏈В閿?*/
  if(!drawPassUnlocked){
    document.getElementById('drawPwdModal').classList.add('on');
    document.getElementById('drawPwdInput').value='';
    document.getElementById('drawPwdErr').classList.remove('on');
    setTimeout(()=>document.getElementById('drawPwdInput').focus(),100);
    return;
  }
  /* 娆℃暟鐢ㄥ畬 */
  if(remainingDraws<=0){
    stageHint.textContent='鎶界娆℃暟宸茬敤瀹?;
    return;
  }
  startDraw();
});

function startDraw(){
  const drawCount=Math.min(+document.getElementById('drawCount').value,drawnPool.length);
  stageWinner.textContent='';
  stageWinners.innerHTML='';
  stageRing.style.display='grid';
  stageHint.textContent='鎶界涓?..';
  drawTimer=setInterval(()=>{
    stageAnimName.textContent=drawnPool[Math.floor(Math.random()*drawnPool.length)].name;
  },60);

  setTimeout(()=>{
    clearInterval(drawTimer);drawTimer=null;
    stageRing.style.display='none';
    const winners=[];
    for(let i=0;i<drawCount;i++){
      const idx=weightedPick(drawnPool);
      winners.push(drawnPool.splice(idx,1)[0]);
    }
    remainingDraws--;
    /* 鏍囪宸叉娊杩?*/
    localStorage.setItem('lottery-draw-used','1');
    /* 淇濆瓨涓鍘嗗彶锛堟寜娆″垎缁勶紝甯︽椂闂达級 */
    let history=JSON.parse(localStorage.getItem('lottery-history')||'[]');
    /* 鍏煎鏃ф暟鎹細鏃х殑鍗曟潯鏁版嵁杞垚绗竴缁?*/
    if(history.length>0 && typeof history[0]!=='object' || history[0] && history[0].name){
      const oldNames=history.map(i=>typeof i==='string'?i:i.name);
      history=[{time:history[0].time||'鍘嗗彶',names:oldNames}];
    }
    const now=new Date();
    const timeStr=`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    history.push({time:timeStr,names:winners.map(w=>w.name)});
    localStorage.setItem('lottery-history',JSON.stringify(history));
    renderHistory();
    if(winners.length===1){
      stageWinner.textContent=winners[0].name;
    }else{
      stageWinner.textContent='鎭枩';
      stageWinners.innerHTML=winners.map(w=>`<div class="stage-winner-item">${w.name}</div>`).join('');
    }
    document.getElementById('saveImgBtn').style.display='inline-block';
    if(remainingDraws<=0){
      stageHint.textContent='鎶界娆℃暟宸茬敤瀹?;
    }else{
      stageHint.textContent='鐐瑰嚮鎸夐挳缁х画鎶界';
    }
  },2000);
}

/* 淇濆瓨缁撴灉鍥撅細鏁撮〉鎴浘鐩存帴涓嬭浇鍒扮浉鍐?*/
async function saveResultImg(){
  const btn=document.getElementById('saveImgBtn');
  btn.textContent='鐢熸垚涓?..';
  btn.disabled=true;
  try{
    const target=document.getElementById('view-stage');
    const rect=target.getBoundingClientRect();
    const canvas=await html2canvas(target,{
      useCORS:true,
      backgroundColor:'#FFF3D6',
      scale:2,
      width:rect.width,
      height:rect.height,
      windowWidth:document.documentElement.clientWidth,
      windowHeight:document.documentElement.clientHeight
    });
    const dataUrl=canvas.toDataURL('image/png');
    /* 鍒涘缓涓存椂鍥剧墖锛岄暱鎸夊彲淇濆瓨鍒扮浉鍐?*/
    const imgWin=window.open('','_blank');
    imgWin.document.write(`<title>闀挎寜鍥剧墖淇濆瓨鍒扮浉鍐?/title><body style="margin:0;background:#f5f5f5;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${dataUrl}" style="max-width:100%;height:auto"><p style="position:fixed;bottom:20px;left:0;right:0;text-align:center;color:#666;font-size:14px">闀挎寜鍥剧墖 鈫?淇濆瓨鍒扮浉鍐?/p></body>`);
    imgWin.document.close();
    toast('宸叉墦寮€鍥剧墖锛岄暱鎸変繚瀛?);
  }catch(e){
    /* 闄嶇骇锛氱洿鎺ヤ笅杞?*/
    try{
      const canvas=await html2canvas(document.getElementById('view-stage'),{useCORS:true,scale:2});
      const link=document.createElement('a');
      link.download=`閲戠鐩茬洅涓_${new Date().getTime()}.png`;
      link.href=canvas.toDataURL('image/png');
      link.click();
      toast('缁撴灉鍥惧凡涓嬭浇');
    }catch(e2){
      toast('鐢熸垚澶辫触锛岃鎵嬪姩鎴浘');
    }
  }finally{
    btn.textContent='闀挎寜淇濆瓨缁撴灉鍥?;
    btn.disabled=false;
  }
}

/* 寮哄埗鍒犻櫎骞冲彴姘村嵃 */
function removeWatermark(){
  document.querySelectorAll('div').forEach(el=>{
    const style=getComputedStyle(el);
    const text=(el.textContent||'').trim();
    if(style.position==='fixed' && 
       (text.includes('璞嗗寘')||text.includes('AI鐢熸垚')||text.includes('ai鐢熸垚')) &&
       el.getBoundingClientRect().bottom > window.innerHeight-100){
      el.remove();
    }
  });
}
setInterval(removeWatermark,1000);
